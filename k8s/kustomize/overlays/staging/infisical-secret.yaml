# Infisical Secrets Operator (v1beta1) — sincroniza o env "staging" do projeto DevExpert
# para o Secret gerenciado "mba-secrets", consumido pelos Deployments via envFrom.
# Pré-requisito (criado fora do git, credenciais da machine identity mba-k8s-prod):
#   kubectl create secret generic universal-auth-credentials -n mba-modulo4 \
#     --from-literal=clientId=<...> --from-literal=clientSecret=<...>
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: infisical-dots
  namespace: mba-modulo4
spec:
  address: https://infisical.dots.dev.br
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: mba-k8s-auth
  namespace: mba-modulo4
spec:
  infisicalConnectionRef:
    name: infisical-dots
    namespace: mba-modulo4
  method: universal
  universal:
    clientIdRef:
      name: universal-auth-credentials
      namespace: mba-modulo4
      key: clientId
    clientSecretRef:
      name: universal-auth-credentials
      namespace: mba-modulo4
      key: clientSecret
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: mba-staging-secrets
  namespace: mba-modulo4
spec:
  infisicalAuthRef:
    name: mba-k8s-auth
    namespace: mba-modulo4
  syncOptions:
    refreshInterval: 60s
    instantUpdates: true
  sources:
    - projectId: 7eed95f6-426d-48bc-8f3a-956348e2825c
      environmentSlug: staging
      secretPath: /
  targets:
    - name: mba-secrets
      namespace: mba-modulo4
      kind: Secret
      creationPolicy: Owner
