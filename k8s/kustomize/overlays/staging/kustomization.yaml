apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mba-modulo4
resources:
  - ../../base
  - configmap.yaml
  - infisical-secret.yaml
  - rabbitmq.yaml
  - hpa.yaml
images:
  - name: ghcr.io/douglasdossantos/mba-auth-api
    newTag: stg-fd9097d
  - name: ghcr.io/douglasdossantos/mba-aluno-api
    newTag: stg-fd9097d
  - name: ghcr.io/douglasdossantos/mba-bff-api
    newTag: stg-fd9097d
  - name: ghcr.io/douglasdossantos/mba-conteudo-api
    newTag: stg-fd9097d
  - name: ghcr.io/douglasdossantos/mba-pagamentos-api
    newTag: stg-fd9097d
  - name: ghcr.io/douglasdossantos/mba-webapp-mvc
    newTag: stg-fd9097d
patches:
  - target:
      kind: Deployment
      name: "(auth-api|aluno-api|bff-api|conteudo-api|pagamentos-api|webapp-mvc)"
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
