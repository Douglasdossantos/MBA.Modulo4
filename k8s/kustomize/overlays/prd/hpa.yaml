# HorizontalPodAutoscaler dos servicos de aplicacao (prd).
# Escala por CPU (~70%), min 2 / max 4. Requer metrics-server (k3s ja inclui)
# e resources.requests.cpu definido nos Deployments.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-api
  namespace: mba-modulo4-prd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
