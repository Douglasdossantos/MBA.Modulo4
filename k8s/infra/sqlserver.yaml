# SQL Server (trilha local/kind) — StatefulSet + Service headless + Service de acesso.
# StatefulSet (em vez de Deployment) e o correto para carga stateful: identidade de rede
# estavel e volume por replica via volumeClaimTemplates (PVC: data-sqlserver-0).
# Pesado: ~2GB de RAM. Local usa SQLite por padrao (DATABASE_PROVIDER=Sqlite); para usar
# SQL Server, troque para SqlServer e aponte as connection strings para "sqlserver:1433".
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-headless
  namespace: mba
  labels:
    app: sqlserver
spec:
  clusterIP: None
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: mba
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: mba
  labels:
    app: sqlserver
spec:
  serviceName: sqlserver-headless
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mba-secrets
                  key: SA_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          resources:
            requests:
              memory: "2Gi"
              cpu: "250m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "3Gi"
              ephemeral-storage: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
