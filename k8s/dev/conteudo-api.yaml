# Conteúdo API — DEV publicado (k3s). A connection string (AppSettings__DatabaseSettings__ConnectionStringConteudo)
# e o JWT vêm do Secret gerenciado pelo Infisical Operator; partes não-secretas do JwtSettings ficam aqui.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conteudo-api
  namespace: mba-modulo4-dev
  annotations:
    secrets.infisical.com/auto-reload: "true"
  labels:
    app: conteudo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conteudo-api
  template:
    metadata:
      labels:
        app: conteudo-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: conteudo-api
          image: ghcr.io/douglasdossantos/mba-conteudo-api:dev-00000000
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mba-config
            - secretRef:
                name: mba-secrets
          env:
            - name: AppSettings__JwtSettings__ExpirationInHours
              value: "2"
            - name: AppSettings__JwtSettings__Issuer
              value: "MBA.Modulo4"
            - name: AppSettings__JwtSettings__Audience
              value: "http://bff-api:8080"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "384Mi"
              ephemeral-storage: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: conteudo-api
  namespace: mba-modulo4-dev
spec:
  selector:
    app: conteudo-api
  ports:
    - port: 8080
      targetPort: 8080
