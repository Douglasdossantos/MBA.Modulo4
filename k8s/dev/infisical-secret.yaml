# Infisical Secrets Operator (v1beta1) — sincroniza o env "dev-cloud" (DEV publicado) do projeto
# DevExpert para o Secret gerenciado "mba-secrets" deste namespace.
# Pré-requisito (criado fora do git):
#   kubectl create secret generic universal-auth-credentials -n mba-modulo4-dev \
#     --from-literal=clientId=<...> --from-literal=clientSecret=<...>
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: infisical-dots
  namespace: mba-modulo4-dev
spec:
  address: https://infisical.dots.dev.br
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: mba-k8s-auth
  namespace: mba-modulo4-dev
spec:
  infisicalConnectionRef:
    name: infisical-dots
    namespace: mba-modulo4-dev
  method: universal
  universal:
    clientIdRef:
      name: universal-auth-credentials
      namespace: mba-modulo4-dev
      key: clientId
    clientSecretRef:
      name: universal-auth-credentials
      namespace: mba-modulo4-dev
      key: clientSecret
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: mba-dev-secrets
  namespace: mba-modulo4-dev
spec:
  infisicalAuthRef:
    name: mba-k8s-auth
    namespace: mba-modulo4-dev
  syncOptions:
    refreshInterval: 60s
    instantUpdates: true
  sources:
    - projectId: 7eed95f6-426d-48bc-8f3a-956348e2825c
      environmentSlug: dev-cloud
      secretPath: /
  targets:
    - name: mba-secrets
      namespace: mba-modulo4-dev
      kind: Secret
      creationPolicy: Owner
