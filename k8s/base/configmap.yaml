# Config compartilhada (não-secreta) — referenciada pelos Deployments dos serviços via envFrom.
# Valores específicos por serviço (connection strings, URLs próprias) ficam no manifest de cada um (T-16+).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mba-config
  namespace: mba
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"

  # Provider de banco (T-14). Default SQLite (leve/confiável no Kind). Para usar o SQL Server do cluster,
  # troque para "SqlServer" e ajuste as connection strings dos serviços para apontar ao Service "sqlserver".
  DATABASE_PROVIDER: "Sqlite"

  # RabbitMQ (Service interno "rabbitmq")
  MessageQueueConnection__MessageBus: "host=rabbitmq:5672;publisherConfirms=true;timeout=30;username=guest;password=guest"

  # JWT (comum aos serviços que usam AppSettings__*)
  AppSettings__ExpiracaoHoras: "2"
  AppSettings__Emissor: "MBA.Modulo4"
  AppSettings__ValidoEm: "http://bff-api:8080"

  # URLs internas (Services do cluster) — usadas pelo BFF e pelo MVC
  AppServicesSettings__AutenticacaoUrl: "http://auth-api:8080"
  AppServicesSettings__AlunoUrl: "http://aluno-api:8080"
  AppServicesSettings__ConteudoUrl: "http://conteudo-api:8080"
  AppServicesSettings__PagamentoUrl: "http://pagamentos-api:8080"
  AppServicesSettings__FaturamentoUrl: "http://pagamentos-api:8080"
  AppSettings__AutenticacaoUrl: "http://auth-api:8080"
  AppSettings__AlunosUrl: "http://aluno-api:8080"
  AppSettings__ConteudoUrl: "http://conteudo-api:8080"
  AppSettings__PagamentosUrl: "http://pagamentos-api:8080"
  AppSettings__BFF: "http://bff-api:8080"
