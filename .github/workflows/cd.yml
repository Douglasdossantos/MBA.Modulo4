# CD — build + push das 6 imagens no Docker Hub a cada merge na master (Módulo 5 DevXpert).
# Reusa o Dockerfile parametrizado (src/Dockerfile, build-arg PROJECT_NAME) numa matrix: 1 imagem por serviço.
# Requer os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (Settings → Secrets and variables → Actions).
name: CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mba-auth-api
            project: MBA.Auth.Api
          - image: mba-conteudo-api
            project: MBA.Conteudo.Api
          - image: mba-aluno-api
            project: MBA.Aluno.API
          - image: mba-pagamentos-api
            project: MBA.Pagamentos.Api
          - image: mba-bff-api
            project: MBA.Bff.Api
          - image: mba-webapp-mvc
            project: MBA.WebApp.MVC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          build-args: |
            PROJECT_NAME=${{ matrix.project }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
