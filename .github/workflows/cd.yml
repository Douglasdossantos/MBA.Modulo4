# CD/GitOps — builda as 6 imagens no GHCR e atualiza os manifests do ambiente correspondente.
# develop => imagens :dev-<sha> + bump em k8s/dev/     (ambiente DEV publicado no k3s)
# master  => imagens :stg-<sha> + bump em k8s/staging/ e k8s/prd/ (Staging e Produção
#            no k3s — produção promove a MESMA imagem validada no staging)
# O Argo CD (rodando no k3s) observa o repositório e aplica as mudanças — o GitHub nunca
# acessa o cluster (GitOps pull-based). Usa o GITHUB_TOKEN nativo: nenhum secret manual.
name: CD

on:
  push:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mba-auth-api
            project: MBA.Auth.Api
          - image: mba-conteudo-api
            project: MBA.Conteudo.Api
          - image: mba-aluno-api
            project: MBA.Aluno.API
          - image: mba-pagamentos-api
            project: MBA.Pagamentos.Api
          - image: mba-bff-api
            project: MBA.Bff.Api
          - image: mba-webapp-mvc
            project: MBA.WebApp.MVC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir tag do ambiente
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "value=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "value=stg-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/${{ matrix.project }}/Dockerfile
          push: true
          tags: |
            ghcr.io/douglasdossantos/${{ matrix.image }}:${{ steps.tag.outputs.value }}

  bump-manifests:
    name: Atualizar manifests (GitOps)
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Bump das imagens no k8s do ambiente
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            TAG="dev-${SHORT_SHA}"; DIRS="k8s/dev"
          else
            TAG="stg-${SHORT_SHA}"; DIRS="k8s/staging k8s/prd"
          fi
          for DIR in ${DIRS}; do
            for IMG in mba-auth-api mba-aluno-api mba-conteudo-api mba-pagamentos-api mba-bff-api mba-webapp-mvc; do
              sed -i "s|image: ghcr.io/douglasdossantos/${IMG}:.*|image: ghcr.io/douglasdossantos/${IMG}:${TAG}|" ${DIR}/*.yaml
            done
          done
          git diff --stat

      - name: Commit e push do bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --cached --quiet && { echo "nada a commitar"; exit 0; }
          git commit -m "chore(cd): Atualizando imagens ${GITHUB_REF_NAME} para ${GITHUB_SHA::7} [skip ci]"
          git push
