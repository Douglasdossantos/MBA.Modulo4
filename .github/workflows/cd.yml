# CD/GitOps — builda as 6 imagens no GHCR e atualiza os manifests do ambiente correspondente.
# develop => imagens :dev-<sha> + bump em k8s/dev/     (ambiente DEV publicado no k3s)
# master  => imagens :stg-<sha> + bump em k8s/staging/ (Staging, automático); a promoção
#            de Produção (k8s/prd/) exige APROVAÇÃO MANUAL: o job "promote-prd" usa o
#            environment "producao" (required reviewers) e promove a MESMA imagem do staging.
# O Argo CD (rodando no k3s) observa o repositório e aplica as mudanças — o GitHub nunca
# acessa o cluster (GitOps pull-based). Usa o GITHUB_TOKEN nativo: nenhum secret manual.
name: CD

on:
  push:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mba-auth-api
            project: MBA.Auth.Api
          - image: mba-conteudo-api
            project: MBA.Conteudo.Api
          - image: mba-aluno-api
            project: MBA.Aluno.API
          - image: mba-pagamentos-api
            project: MBA.Pagamentos.Api
          - image: mba-bff-api
            project: MBA.Bff.Api
          - image: mba-webapp-mvc
            project: MBA.WebApp.MVC

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Definir tag do ambiente
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "value=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "value=stg-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/${{ matrix.project }}/Dockerfile
          push: true
          tags: |
            ghcr.io/douglasdossantos/${{ matrix.image }}:${{ steps.tag.outputs.value }}

      # Scan de vulnerabilidades da imagem publicada (item de seguranca do escopo).
      # ADVISORY: exit-code '0' nao quebra a esteira. Troque para '1' para bloquear em CVE High/Critical.
      - name: Trivy - scan de vulnerabilidades (${{ matrix.image }})
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/douglasdossantos/${{ matrix.image }}:${{ steps.tag.outputs.value }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

  bump-manifests:
    name: Atualizar manifests (GitOps)
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Bump das imagens no k8s do ambiente
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            TAG="dev-${SHORT_SHA}"; DIR="k8s/kustomize/overlays/dev"
          else
            TAG="stg-${SHORT_SHA}"; DIR="k8s/kustomize/overlays/staging"
          fi
          # Atualiza as 6 tags de imagem no kustomization.yaml do overlay do ambiente.
          sed -i "s|^    newTag: .*|    newTag: ${TAG}|" ${DIR}/kustomization.yaml
          git diff --stat

      - name: Commit e push do bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --cached --quiet && { echo "nada a commitar"; exit 0; }
          git commit -m "chore(cd): Atualizando imagens ${GITHUB_REF_NAME} para ${GITHUB_SHA::7} [skip ci]"
          git push

  promote-prd:
    name: Promover Produção (aprovação manual)
    runs-on: ubuntu-latest
    needs: bump-manifests
    if: github.ref_name == 'master'
    # O environment "producao" tem required reviewers: este job fica em "Waiting"
    # até um revisor humano validar o Staging no ar e aprovar em Actions >
    # "Review deployments". Só então k8s/prd/ recebe a MESMA imagem já validada
    # no staging (promoção sem rebuild) e o Argo CD publica a Produção.
    environment: producao
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Promover a imagem validada no staging para k8s/prd
        run: |
          TAG="stg-${GITHUB_SHA::7}"
          sed -i "s|^    newTag: .*|    newTag: ${TAG}|" k8s/kustomize/overlays/prd/kustomization.yaml
          git diff --stat

      - name: Commit e push da promoção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomize/overlays/prd/
          git diff --cached --quiet && { echo "Produção já está em ${GITHUB_SHA::7}"; exit 0; }
          git commit -m "chore(cd): Promovendo Produção para ${GITHUB_SHA::7} [skip ci]"
          git push
