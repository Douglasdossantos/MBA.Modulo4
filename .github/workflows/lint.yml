# Lint / análise estática — verifica formatação (dotnet format) em cada push/PR na master.
# Baseline: rode `dotnet format MBA.Modulo4.sln` uma vez e commite, senão este check fica vermelho.
name: Lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  format:
    name: dotnet format (verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MBA.Modulo4.sln

      - name: Verify format
        run: dotnet format MBA.Modulo4.sln --verify-no-changes --severity warn
