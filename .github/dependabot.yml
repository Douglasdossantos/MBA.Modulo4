# Atualizacao automatica de dependencias (item de seguranca do escopo).
# Abre PRs semanais para pacotes NuGet, imagens Docker e as proprias GitHub Actions.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directories:
      - "/src"
      - "/src/*"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
